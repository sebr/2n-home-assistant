# Development configuration. A trimmed set of integrations replaces
# `default_config:` so Home Assistant starts in seconds.

homeassistant:
  name: 2N Dev

# No http: block. Home Assistant 2026.11+ keeps HTTP settings in .storage/http;
# scripts/develop sets the port through SETUP_PORT instead.

frontend:
config:
api:
# WebRTC for camera live streams, needed for two-way audio.
go2rtc:
history:
logbook:
recorder:
  commit_interval: 30

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

logger:
  default: info
  logs:
    custom_components.two_n_intercom: debug
